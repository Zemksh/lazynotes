[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lazynotes-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "celery[redis]>=5.4,<6", "httpx>=0.28,<1",
  "pypdf>=5.3,<7", "filelock>=3.17,<4",
]

[project.optional-dependencies]
# faster-whisper 1.2.1 passes metadata_errors, removed in PyAV 19.
# https://github.com/SYSTRAN/faster-whisper/issues/1589
transcription = ["faster-whisper>=1.1,<2", "av>=11,<19"]
test = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
